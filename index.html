<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bassoon Key App</title>
    <meta name="theme-color" content="#ffffff">
    <!-- PWA: Standalone/Fullscreen support -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="page-content" aria-label="アプリ本体">
      <h1 id="app-title">Bassoon Fingering App</h1>
      <!-- バスーンキーのSVGはランタイムで読み込み・インライン挿入 -->
      <div id="bassoon-wrapper" data-src="picture/bassoon_key.svg" aria-label="バスーンキー SVG"></div>
      <!-- 音名と楽譜コントロール -->
      <div id="note-controls" aria-label="音名と楽譜設定" class="d-flex flex-wrap align-items-center gap-2">
        <div class="control-group main-group d-inline-flex align-items-center gap-2">
          <label for="octave-select" class="form-label mb-0">Oct:</label>
          <select id="octave-select" class="form-select form-select-sm w-auto">
            <option value="5">C5</option>
            <option value="4" selected>C4</option>
            <option value="3">C3</option>
            <option value="2">C2</option>
            <option value="1">C1</option>
          </select>
          <label for="note-select" class="form-label mb-0">Note:</label>
          <select id="note-select" class="form-select form-select-sm w-auto">
            <option value="11">B</option>
            <option value="10">A#/Bb</option>
            <option value="9">A</option>
            <option value="8">G#/Ab</option>
            <option value="7">G</option>
            <option value="6">F#/Gb</option>
            <option value="5">F</option>
            <option value="4">E</option>
            <option value="3">D#/Eb</option>
            <option value="2">D</option>
            <option value="1">C#/Db</option>
            <option value="0" selected>C</option>
          </select>
        </div>
        <div class="control-group trill-group d-inline-flex align-items-center gap-2">
          <div class="form-check form-switch m-0">
            <input id="trill-enabled" type="checkbox" class="form-check-input" />
            <label for="trill-enabled" class="form-check-label">Trill</label>
          </div>
          <label for="trill-octave-select" class="form-label mb-0">Oct:</label>
          <select id="trill-octave-select" class="form-select form-select-sm w-auto" disabled>
            <option value="5">C5</option>
            <option value="4" selected>C4</option>
            <option value="3">C3</option>
            <option value="2">C2</option>
            <option value="1">C1</option>
          </select>
          <label for="trill-note-select" class="form-label mb-0">Note:</label>
          <select id="trill-note-select" class="form-select form-select-sm w-auto" disabled>
            <option value="11">B</option>
            <option value="10">A#/Bb</option>
            <option value="9">A</option>
            <option value="8">G#/Ab</option>
            <option value="7">G</option>
            <option value="6">F#/Gb</option>
            <option value="5">F</option>
            <option value="4">E</option>
            <option value="3">D#/Eb</option>
            <option value="2">D</option>
            <option value="1">C#/Db</option>
            <option value="0" selected>C</option>
          </select>
        </div>
      </div>
      <!-- 常設のメモ入力欄は削除：モーダルのみ使用 -->
      <div id="controls">
        <button id="memo-btn" type="button" aria-label="メモや注釈を入力">Memo</button>
        <button id="download-btn" type="button" disabled aria-label="運指図を画像としてダウンロード">Download</button>
        <button id="share-btn" type="button" disabled aria-label="SNSに画像とメモを共有">Share</button>
      </div>
    </div>
    <!-- テキスト入力モーダル -->
    <div id="text-modal" role="dialog" aria-modal="true" aria-labelledby="text-modal-title" hidden>
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-dialog" role="document">
        <div class="modal-header">
          <h2 id="text-modal-title">Memo</h2>
          <div class="modal-actions">
            <button id="text-delete-btn" type="button" aria-label="テキストを削除">Delete</button>
            <button id="text-close-btn" type="button" aria-label="モーダルを閉じる">Close</button>
          </div>
        </div>
        <div class="modal-body">
          <textarea id="text-area" placeholder="ここにメモや運指の注記を書いてください" rows="4"></textarea>
        </div>
      </div>
    </div>
    <script src="app.js" defer></script>
  </body>
  </html>
