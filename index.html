<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bassoon Key App</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!-- バスーンキーのSVGはランタイムで読み込み・インライン挿入 -->
    <div id="bassoon-wrapper" data-src="picture/bassoon_key.svg" aria-label="バスーンキー SVG"></div>
    <!-- SVG直下の常設メモ入力欄 -->
    <div id="inline-notes">
      <textarea id="inline-text-area" aria-label="Notes" placeholder="ここにメモや運指の注記を書いてください"></textarea>
    </div>
    <div id="controls">
      <button id="text-btn" type="button" aria-haspopup="dialog" aria-controls="text-modal" aria-label="テキスト入力モーダルを開く">Memo</button>
      <button id="download-btn" type="button" disabled aria-label="運指図を画像としてダウンロード">Download</button>
    </div>
    <!-- テキスト入力モーダル -->
    <div id="text-modal" role="dialog" aria-modal="true" aria-labelledby="text-modal-title" hidden>
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-dialog" role="document">
        <div class="modal-header">
          <h2 id="text-modal-title">Memo</h2>
          <div class="modal-actions">
            <button id="text-delete-btn" type="button" aria-label="テキストを削除">Delete</button>
            <button id="text-close-btn" type="button" aria-label="モーダルを閉じる">Close</button>
          </div>
        </div>
        <div class="modal-body">
          <textarea id="text-area" placeholder="ここにメモや運指の注記を書いてください"></textarea>
        </div>
      </div>
    </div>
    <script src="app.js" defer></script>
  </body>
  </html>
